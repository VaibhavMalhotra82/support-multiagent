version: '3.8'

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - '8000:8000'
    volumes:
      - ./:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DATABASE_URL=sqlite:///./support_agent.db
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
